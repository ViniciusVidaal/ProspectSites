services:
  - type: web
    name: prospect-sites-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: Leads
      - key: FRONTEND_ORIGINS
        sync: false
      - key: HEADLESS
        value: "true"
      - key: WHATSAPP_PROFILE_DIR
        value: /tmp/whatsapp-profile
